<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play KBC Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        .kbc-gradient { background: radial-gradient(circle, #1e1e2f 0%, #000000 100%); }
        .option-btn { transition: transform 0.1s; touch-action: manipulation; }
        .option-btn:active { transform: scale(0.95); }
        .correct-anim { animation: flashGreen 1s infinite; background-color: #059669 !important; border-color: #34d399 !important; }
        .wrong-anim { background-color: #991b1b !important; border-color: #f87171 !important; opacity: 0.7; }
        @keyframes flashGreen { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .rank-0 { background: linear-gradient(45deg, #FFD700, #FDB931); border-color: #FFF; color: black; text-shadow: none; transform: scale(1.05); }
        .rank-1 { background: linear-gradient(45deg, #E0E0E0, #BDBDBD); border-color: #FFF; color: black; text-shadow: none; }
        .rank-2 { background: linear-gradient(45deg, #CD7F32, #A0522D); border-color: #FFF; color: white; }

        #user-badge { backdrop-filter: blur(5px); background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="kbc-gradient text-white h-screen flex flex-col items-center justify-center font-sans overflow-hidden p-4 relative">

    <div id="user-badge" class="hidden absolute top-4 right-4 border border-gray-600 rounded-full px-4 py-2 flex items-center gap-2 shadow-lg z-50">
        <div id="conn-dot" class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        <span id="badge-name" class="font-bold text-sm text-gray-200"></span>
    </div>

    <div id="screen-login" class="text-center w-full max-w-md">
        <h1 class="text-4xl font-bold text-yellow-500 mb-8">KBC QUIZ</h1>
        <input type="text" id="player-name" placeholder="Enter Your Name" class="w-full p-4 rounded text-black text-xl mb-4 text-center">
        <button onclick="joinGame()" class="w-full bg-blue-600 py-4 rounded-full text-xl font-bold shadow-lg hover:bg-blue-500">JOIN GAME</button>
        <p id="rejoin-msg" class="text-sm text-green-400 mt-4 hidden">🔄 Found previous session...</p>
    </div>

    <div id="screen-waiting" class="hidden text-center w-full max-w-md">
        <h2 class="text-2xl animate-pulse font-bold text-green-400">You are in!</h2>
        <p class="text-gray-400 mt-2">Waiting for the host...</p>
    </div>

    <div id="screen-question" class="hidden w-full max-w-2xl flex flex-col h-full justify-center">
        <div id="q-status-bar" class="text-right text-yellow-500 font-mono text-sm mb-2">LIVE QUESTION</div>
        
        <div id="q-text-display" class="bg-blue-900 border-2 border-yellow-500 p-6 rounded-xl text-xl md:text-2xl text-center mb-6 shadow-xl font-bold">Loading...</div>
        
        <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
            <button id="btn-A" onclick="submitAnswer('A')" class="option-btn bg-gray-800 border-2 border-gray-600 p-4 rounded-lg hover:bg-blue-900 flex items-center"><span class="text-yellow-500 font-bold mr-3 text-xl">A:</span> <span id="opt-A"></span></button>
            <button id="btn-B" onclick="submitAnswer('B')" class="option-btn bg-gray-800 border-2 border-gray-600 p-4 rounded-lg hover:bg-blue-900 flex items-center"><span class="text-yellow-500 font-bold mr-3 text-xl">B:</span> <span id="opt-B"></span></button>
            <button id="btn-C" onclick="submitAnswer('C')" class="option-btn bg-gray-800 border-2 border-gray-600 p-4 rounded-lg hover:bg-blue-900 flex items-center"><span class="text-yellow-500 font-bold mr-3 text-xl">C:</span> <span id="opt-C"></span></button>
            <button id="btn-D" onclick="submitAnswer('D')" class="option-btn bg-gray-800 border-2 border-gray-600 p-4 rounded-lg hover:bg-blue-900 flex items-center"><span class="text-yellow-500 font-bold mr-3 text-xl">D:</span> <span id="opt-D"></span></button>
        </div>

        <div id="result-feedback" class="hidden mt-6 text-center p-4 rounded-lg font-bold text-2xl border-2"></div>
    </div>

    <div id="screen-answered" class="hidden text-center w-full max-w-md">
        <div class="bg-gray-800 p-6 rounded-xl border-2 border-blue-500">
            <h2 class="text-xl font-bold text-blue-300">Answer Recorded 🔒</h2>
            <p class="text-gray-400 mt-2">Please wait for the results.</p>
        </div>
    </div>

    <div id="screen-leaderboard" class="hidden w-full max-w-md text-center h-full flex flex-col justify-center">
        <h2 id="lb-title" class="text-3xl font-bold text-yellow-400 mb-6">🏆 LEADERBOARD</h2>
        <div id="leaderboard-list" class="space-y-3 w-full"></div>
        <p id="lb-wait-msg" class="mt-8 text-gray-500 text-sm animate-pulse">Waiting for next question...</p>
    </div>

    <script>
        const SUPABASE_URL = "https://ndkwlfyqbbkohhccsijm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ka3dsZnlxYmJrb2hoY2NzaWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDc1OTcsImV4cCI6MjA4MzI4MzU5N30.r5vOKPTc65gyoesWuiiT_slt2ldlEX6K0D2bbdS1nZI"; 

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <script>
        let myId = null;
        let myLastAnsweredQ = 0;
        let currentQData = null;
        let isSubmitting = false; 
        
        // --- AUTO-SYNC SETUP ---
        // We will fetch state every 4 seconds to ensure no one gets stuck
        const SYNC_INTERVAL_MS = 4000;
        let syncInterval = null;

        window.onload = () => {
            checkExistingSession();
            // Start the Safety Net Polling
            syncInterval = setInterval(fetchGameStateForce, SYNC_INTERVAL_MS);
            
            // Also force sync when user comes back to the tab
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === 'visible') fetchGameStateForce();
            });
        };

        function updateIdentityBadge(name) {
            document.getElementById('badge-name').innerText = name;
            document.getElementById('user-badge').classList.remove('hidden');
        }

        async function checkExistingSession() {
            const storedId = localStorage.getItem('kbc_player_id');
            if (storedId) {
                const { data } = await _supabase.from('players').select('id, name, last_answered_q_id').eq('id', storedId).single();
                
                if (data) {
                    myId = data.id;
                    myLastAnsweredQ = data.last_answered_q_id || 0;
                    document.getElementById('player-name').value = data.name; 
                    document.getElementById('rejoin-msg').classList.remove('hidden');
                    updateIdentityBadge(data.name);

                    showScreen('screen-waiting');
                    listenToGame();
                    fetchGameStateForce(); // Immediate fetch
                } else {
                    localStorage.removeItem('kbc_player_id'); 
                }
            }
        }

        async function joinGame() {
            if(myId) { showScreen('screen-waiting'); return; }

            const name = document.getElementById('player-name').value.trim();
            if(!name) return alert("Name is required");

            const { data: existingUser } = await _supabase.from('players').select('id, name, last_answered_q_id').eq('name', name).single();

            if (existingUser) {
                myId = existingUser.id;
                myLastAnsweredQ = existingUser.last_answered_q_id || 0;
            } else {
                const { data, error } = await _supabase.from('players').insert([{ name: name }]).select();
                if(error) return alert("Error joining");
                myId = data[0].id;
                myLastAnsweredQ = 0;
            }

            localStorage.setItem('kbc_player_id', myId);
            updateIdentityBadge(name);

            showScreen('screen-waiting');
            listenToGame();
            fetchGameStateForce();
        }

        async function submitAnswer(selectedOption) {
            if(isSubmitting) return;
            isSubmitting = true;
            
            // UI Feedback
            const originalText = document.getElementById('opt-' + selectedOption).innerText;
            ['A','B','C','D'].forEach(opt => document.getElementById('btn-'+opt).classList.add('opacity-50', 'pointer-events-none'));
            document.getElementById('opt-' + selectedOption).innerText = "Checking...";

            // Retry Mechanism (3 Attempts)
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    await processAnswer(selectedOption);
                    return; 
                } catch (err) {
                    console.warn(`Attempt ${attempt} failed`, err);
                    if (attempt === 3) {
                        alert("⚠️ Connection failed. Please try again.");
                        resetButtons(selectedOption, originalText);
                        isSubmitting = false;
                    } else {
                        await new Promise(r => setTimeout(r, 500));
                    }
                }
            }
        }

        async function processAnswer(selectedOption) {
            const isCorrect = (selectedOption === currentQData.correct_option);
            const feedbackBox = document.getElementById('result-feedback');

            if (isCorrect) {
                const { data: player } = await _supabase.from('players').select('last_answered_q_id, score').eq('id', myId).single();
                
                if (player.last_answered_q_id === currentQData.id) {
                    myLastAnsweredQ = currentQData.id;
                    showScreen('screen-answered'); 
                    return;
                }

                const { data: claimData } = await _supabase
                    .from('questions')
                    .update({ fastest_player_id: myId })
                    .eq('id', currentQData.id)
                    .is('fastest_player_id', null) 
                    .select();

                let points = 10;
                let msg = "+10 Points";
                if (claimData && claimData.length > 0) { points = 12; msg = "⚡ FASTEST! +12 Points ⚡"; }

                const btn = document.getElementById('btn-' + selectedOption);
                btn.classList.add('correct-anim');
                feedbackBox.innerHTML = `✅ CORRECT! <br> <span class='text-sm font-bold'>${msg}</span>`;
                feedbackBox.className = "mt-6 text-center p-4 rounded-lg font-bold text-2xl border-2 bg-green-900 border-green-500 text-white";
                
                await _supabase.from('players').update({ 
                    score: (player.score || 0) + points,
                    last_answer_time: new Date().toISOString(),
                    last_answered_q_id: currentQData.id 
                }).eq('id', myId);
                
                myLastAnsweredQ = currentQData.id;

            } else {
                await _supabase.from('players').update({ last_answered_q_id: currentQData.id }).eq('id', myId);
                myLastAnsweredQ = currentQData.id;
                
                const btn = document.getElementById('btn-' + selectedOption);
                btn.classList.add('wrong-anim');
                feedbackBox.innerHTML = `❌ WRONG! <br> <span class='text-sm text-gray-300'>Answer was ${currentQData.correct_option}</span>`;
                feedbackBox.className = "mt-6 text-center p-4 rounded-lg font-bold text-2xl border-2 bg-red-900 border-red-500 text-white";
            }
            feedbackBox.classList.remove('hidden');
        }

        function resetButtons(selectedOption, text) {
            ['A','B','C','D'].forEach(opt => document.getElementById('btn-'+opt).classList.remove('opacity-50', 'pointer-events-none'));
            document.getElementById('opt-' + selectedOption).innerText = text;
        }

        function listenToGame() {
            // Realtime Listener (FAST)
            _supabase.channel('public:game_state')
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state' }, 
                (payload) => handleGameState(payload.new)
            ).subscribe();
        }

        // Safety Net Polling Function
        async function fetchGameStateForce() {
            if (!myId) return; // Don't poll if not logged in
            
            // Check internet
            const dot = document.getElementById('conn-dot');
            if(!navigator.onLine) {
                dot.classList.replace('bg-green-500', 'bg-red-500');
                return;
            } else {
                dot.classList.replace('bg-red-500', 'bg-green-500');
            }

            const { data: state, error } = await _supabase.from('game_state').select('*').eq('id', 1).single();
            if (state && !error) {
                // Only update if something changed or we are stuck
                if (!currentQData || state.current_question_id !== currentQData.id || state.status !== 'active') {
                    handleGameState(state);
                }
            }
        }

        async function handleGameState(state) {
            if (state.status === 'active') {
                if (myLastAnsweredQ === state.current_question_id) {
                    showScreen('screen-answered');
                    return;
                }

                if (currentQData && currentQData.id === state.current_question_id) return;

                // Load Question
                const { data: q } = await _supabase.from('questions').select('*').eq('id', state.current_question_id).single();
                currentQData = q;
                isSubmitting = false; 

                ['A','B','C','D'].forEach(opt => {
                    document.getElementById('opt-'+opt).innerText = q['option_'+opt.toLowerCase()];
                    const btn = document.getElementById('btn-'+opt);
                    btn.className = "option-btn bg-gray-800 border-2 border-gray-600 p-4 rounded-lg hover:bg-blue-900 flex items-center";
                    btn.classList.remove('opacity-50', 'pointer-events-none', 'correct-anim', 'wrong-anim'); 
                });
                document.getElementById('q-text-display').innerText = q.question_text;
                document.getElementById('result-feedback').classList.add('hidden');
                
                showScreen('screen-question');
            } 
            else if (state.status === 'leaderboard') {
                document.getElementById('lb-title').innerText = "🏆 LEADERBOARD";
                document.getElementById('lb-wait-msg').classList.remove('hidden');
                updateLeaderboard(false);
                showScreen('screen-leaderboard');
            }
            else if (state.status === 'finished') {
                document.getElementById('lb-title').innerText = "🎉 FINAL WINNERS 🎉";
                document.getElementById('lb-wait-msg').classList.add('hidden');
                updateLeaderboard(true); 
                showScreen('screen-leaderboard');
            }
            else if (state.status === 'waiting') {
                showScreen('screen-waiting');
            }
        }

        async function updateLeaderboard(isFinal) {
            const { data: players } = await _supabase.from('players').select('*')
                .order('score', { ascending: false })
                .order('last_answer_time', { ascending: true, nullsFirst: false }) 
                .limit(5);

            const list = document.getElementById('leaderboard-list');
            list.innerHTML = "";
            players.forEach((p, index) => {
                let cardClass = "bg-gray-800 border-gray-700";
                if(isFinal) {
                    if (index === 0) cardClass = "rank-0 shadow-yellow-500/50";
                    else if (index === 1) cardClass = "rank-1";
                    else if (index === 2) cardClass = "rank-2";
                }
                const medal = ["🥇","🥈","🥉","4️⃣","5️⃣"][index] || `#${index+1}`;
                list.innerHTML += `
                    <div class="${cardClass} border-2 p-3 rounded-lg flex justify-between items-center shadow-lg transition-all duration-500">
                        <span class="font-bold text-xl flex items-center gap-2">
                            <span class="text-2xl">${medal}</span> ${p.name}
                        </span>
                        <div class="text-right">
                            <span class="block font-mono text-xl leading-none font-bold">${p.score}</span>
                        </div>
                    </div>`;
            });
            if(isFinal) list.innerHTML += `<div class="mt-6 text-gray-400 text-sm">Thanks for playing!</div>`;
        }

        function showScreen(id) {
            ['screen-login', 'screen-waiting', 'screen-question', 'screen-answered', 'screen-leaderboard'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
