<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KBC Host Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-5 font-sans">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-400 mb-5">🎓 KBC Host Control</h1>
        
        <div id="login-panel" class="mb-5">
            <input type="password" id="host-pwd" placeholder="Host Password" class="p-2 text-black rounded">
            <button onclick="checkPwd()" class="bg-blue-600 px-4 py-2 rounded">Login</button>
        </div>

        <div id="admin-panel" class="hidden space-y-6">
            
            <div class="bg-gray-800 p-4 rounded shadow flex items-center justify-between">
                <div>
                    <h2 class="text-xl mb-2">Invite Players</h2>
                    <p class="text-sm text-gray-400">Scan to join the Game Screen</p>
                    <p id="player-link-text" class="text-xs text-blue-300 mt-2 break-all"></p>
                </div>
                <div class="bg-white p-2 rounded">
                    <div id="qrcode"></div>
                </div>
            </div>

            <div class="bg-gray-700 p-4 rounded text-center">
                <span class="text-2xl font-bold text-green-400" id="q-count">Checking Database...</span>
                <p class="text-sm text-gray-300">Questions currently in Database</p>
            </div>

            <div class="bg-gray-800 p-4 rounded shadow grid grid-cols-2 gap-4">
                <button onclick="resetGame()" class="bg-red-600 hover:bg-red-700 p-4 rounded font-bold">🔁 Reset Game (Clear All)</button>
                <button onclick="setNextQuestion()" class="bg-green-600 hover:bg-green-700 p-4 rounded font-bold text-xl">➡️ START / NEXT Question</button>
                <button onclick="showLeaderboard()" class="bg-purple-600 hover:bg-purple-700 p-4 rounded font-bold">🏆 Show Leaderboard</button>
                <button onclick="playMusic()" class="bg-yellow-600 hover:bg-yellow-700 p-4 rounded font-bold">🎵 Play Sound</button>
            </div>

            <div class="bg-gray-800 p-4 rounded shadow border-2 border-blue-900">
                <h2 class="text-xl mb-4 font-bold text-blue-400">Add Question to Bank</h2>
                <input type="text" id="q-text" placeholder="Question Text" class="w-full p-2 mb-2 text-black rounded">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" id="opt-a" placeholder="Option A" class="p-2 text-black rounded">
                    <input type="text" id="opt-b" placeholder="Option B" class="p-2 text-black rounded">
                    <input type="text" id="opt-c" placeholder="Option C" class="p-2 text-black rounded">
                    <input type="text" id="opt-d" placeholder="Option D" class="p-2 text-black rounded">
                </div>
                <select id="correct-opt" class="p-2 text-black rounded w-full mb-2">
                    <option value="A">Answer: A</option>
                    <option value="B">Answer: B</option>
                    <option value="C">Answer: C</option>
                    <option value="D">Answer: D</option>
                </select>
                <button onclick="addQuestion()" class="bg-blue-600 hover:bg-blue-500 w-full py-2 rounded font-bold">➕ Save Question to Bank</button>
            </div>
            
            <div id="status-log" class="text-green-400 font-mono text-sm mt-4"></div>
        </div>
    </div>

    <audio id="sound-suspense" src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3"></audio>

    <script src="config.js"></script>
    <script>
        const HOST_PASSWORD = "123"; 

        function checkPwd() {
            if(document.getElementById('host-pwd').value === HOST_PASSWORD) {
                document.getElementById('login-panel').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                generateQR();
                updateQuestionCount();
            } else { alert("Wrong Password"); }
        }

        function generateQR() {
            // FIX: Robustly remove 'admin' or 'admin.html' to get the root player URL
            let url = window.location.href;
            
            // 1. Remove 'admin.html' if present
            url = url.replace('admin.html', '');
            
            // 2. Remove 'admin' if present (e.g. at end of url)
            // We use a regular expression to match 'admin' only at the end of the string
            url = url.replace(/admin\/?$/, '');
            
            // 3. Ensure it ends in a slash so it loads index.html
            if(!url.endsWith('/')) url += '/';

            console.log("Player URL:", url);
            
            // Show the text so you can verify it
            document.getElementById("player-link-text").innerText = url;
            
            // Generate QR
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: url, width: 100, height: 100 });
        }

        function log(msg) { document.getElementById('status-log').innerText = msg; }

        async function updateQuestionCount() {
            const { count } = await _supabase.from('questions').select('*', { count: 'exact', head: true });
            document.getElementById('q-count').innerText = (count || 0) + " Questions Ready";
        }

        async function resetGame() {
            if(!confirm("Are you sure? This deletes ALL players and resets the game.")) return;
            await _supabase.from('players').delete().neq('score', -1); 
            await _supabase.from('game_state').update({ status: 'waiting', current_question_id: null }).eq('id', 1);
            log("Game Reset! Players cleared.");
            currentQIndex = 0;
        }

        async function addQuestion() {
            const q = {
                question_text: document.getElementById('q-text').value,
                option_a: document.getElementById('opt-a').value,
                option_b: document.getElementById('opt-b').value,
                option_c: document.getElementById('opt-c').value,
                option_d: document.getElementById('opt-d').value,
                correct_option: document.getElementById('correct-opt').value
            };

            if(!q.question_text || !q.option_a) return alert("Fill in the question fields!");

            const { error } = await _supabase.from('questions').insert([q]);
            
            if(error) { alert("Error adding question"); } 
            else { 
                log("Question Saved! Add another or Click Next to Start.");
                document.getElementById('q-text').value = "";
                document.getElementById('opt-a').value = "";
                document.getElementById('opt-b').value = "";
                document.getElementById('opt-c').value = "";
                document.getElementById('opt-d').value = "";
                updateQuestionCount(); 
            }
        }

        let currentQIndex = 0;

        async function setNextQuestion() {
            // Get all questions
            const { data: questions } = await _supabase.from('questions').select('*').order('id', { ascending: true });
            
            if (!questions || questions.length === 0) return alert("No questions added yet!");
            if (currentQIndex >= questions.length) return alert("No more questions! Game Over.");

            const nextQ = questions[currentQIndex];

            // Push to Game State (This makes it live for players)
            await _supabase.from('game_state').update({ 
                status: 'active', 
                current_question_id: nextQ.id,
                question_start_time: new Date().toISOString()
            }).eq('id', 1);

            currentQIndex++;
            log(`Question ${currentQIndex} is LIVE! Players can now see it.`);
        }

        async function showLeaderboard() {
            await _supabase.from('game_state').update({ status: 'leaderboard' }).eq('id', 1);
            log("Leaderboard is visible to players.");
        }

        function playMusic() {
            document.getElementById('sound-suspense').play();
        }
    </script>
</body>
</html>
