<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Corporate Cut Host Admin (High Performance)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white p-5 font-sans">
    <div id="qr-modal" onclick="closeFullscreenQR()" class="hidden fixed inset-0 z-50 bg-black flex flex-col items-center justify-center cursor-pointer">
    <h1 class="text-5xl font-bold text-yellow-400 mb-10 animate-pulse">📲 Scan to Join!</h1>
    
    <div class="bg-white p-6 rounded-2xl shadow-[0_0_50px_rgba(255,255,0,0.5)]">
        <div id="qrcode-large"></div>
    </div>
    
    <p class="text-gray-400 mt-10 text-xl">Click anywhere to close</p>
    </div>

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-400 mb-5">🎓 CC Host Control (Pro)</h1>
        
        <div id="login-panel" class="mb-5">
            <input type="password" id="host-pwd" placeholder="Host Password" class="p-2 text-black rounded">
            <button id="login-btn" onclick="checkPwd()" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-500 transition">Login</button>
            <p id="login-status" class="text-sm text-gray-400 mt-2"></p>
        </div>

        <div id="admin-panel" class="hidden space-y-6">
            
            <div id="connection-health" class="text-xs text-right text-green-500 font-mono">🟢 System Online</div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-gray-800 p-4 rounded shadow flex items-center justify-between">
                    <div>
                        <h2 class="text-xl mb-2">Invite Players</h2>
                        <p id="player-link-text" class="text-xs text-blue-300 mt-2 break-all"></p>
                    </div>
                    <div class="bg-white p-2 rounded cursor-pointer hover:scale-105 transition duration-300" onclick="showFullscreenQR()" title="Click to Fullscreen">
                    <div id="qrcode"></div>
                    </div>
                </div>

                <div class="bg-gray-700 p-4 rounded text-center flex flex-col justify-center relative">
                    <span class="text-4xl font-bold text-green-400" id="q-count">...</span>
                    <p class="text-sm text-gray-300">Questions in Bank</p>
                    <button onclick="refreshData()" class="absolute top-2 right-2 text-xs bg-gray-600 px-2 py-1 rounded hover:bg-gray-500">🔄 Refresh</button>
                </div>
            </div>

            <div class="bg-gray-800 p-4 rounded shadow grid grid-cols-2 gap-4">
                <button onclick="resetGame()" class="bg-red-600 hover:bg-red-700 p-4 rounded font-bold transition">🔁 Reset Game</button>
                <button id="btn-next" onclick="setNextQuestion()" class="bg-green-600 hover:bg-green-700 p-4 rounded font-bold text-xl transition">➡️ NEXT Question</button>
                <button id="btn-leaderboard" onclick="toggleLeaderboard()" class="bg-purple-600 hover:bg-purple-700 p-4 rounded font-bold transition">🏆 Show Leaderboard</button>
                <button onclick="playMusic()" class="bg-yellow-600 hover:bg-yellow-700 p-4 rounded font-bold transition">🎵 Sound</button>
            </div>

            <div id="game-over-msg" class="hidden bg-yellow-600 p-4 rounded text-center font-bold text-2xl border-2 border-yellow-400 shadow-lg">
                🎉 GAME OVER! FINAL RESULTS SENT 🎉
            </div>

            <div id="admin-leaderboard-panel" class="hidden bg-purple-900 p-4 rounded border-2 border-purple-500">
                <h2 class="text-xl font-bold mb-2">🏆 Live Leaderboard</h2>
                <div id="admin-lb-list" class="space-y-2"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-gray-800 p-4 rounded shadow border-2 border-blue-900">
                    <h2 class="text-xl mb-4 font-bold text-blue-400">Add New Question</h2>
                    <input type="text" id="q-text" placeholder="Question Text" class="w-full p-2 mb-2 text-black rounded">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="text" id="opt-a" placeholder="A" class="p-2 text-black rounded">
                        <input type="text" id="opt-b" placeholder="B" class="p-2 text-black rounded">
                        <input type="text" id="opt-c" placeholder="C" class="p-2 text-black rounded">
                        <input type="text" id="opt-d" placeholder="D" class="p-2 text-black rounded">
                    </div>
                    <select id="correct-opt" class="p-2 text-black rounded w-full mb-2">
                        <option value="A">Answer: A</option>
                        <option value="B">Answer: B</option>
                        <option value="C">Answer: C</option>
                        <option value="D">Answer: D</option>
                    </select>
                    <button onclick="addQuestion()" class="bg-blue-600 hover:bg-blue-500 w-full py-2 rounded font-bold transition">➕ Save Question</button>
                </div>

                <div class="bg-gray-800 p-4 rounded shadow">
                    <h2 class="text-xl mb-4 font-bold text-gray-300">Question Bank</h2>
                    <div id="db-questions-list" class="space-y-2 h-64 overflow-y-auto pr-2"></div>
                </div>
            </div>
            
            <div id="status-log" class="text-green-400 font-mono text-sm mt-4"></div>
        </div>
    </div>

    <audio id="sound-suspense" src="https://www.soundjay.com/misc/sounds/magic-chime-01.mp3"></audio>

    <script>
        const SUPABASE_URL = "https://ndkwlfyqbbkohhccsijm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ka3dsZnlxYmJrb2hoY2NzaWptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MDc1OTcsImV4cCI6MjA4MzI4MzU5N30.r5vOKPTc65gyoesWuiiT_slt2ldlEX6K0D2bbdS1nZI"; 

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    </script>

    <script>
        const HOST_PASSWORD = "eric26"; 
        let currentQIndex = 0;

        async function checkPwd() {
            const pwdInput = document.getElementById('host-pwd');
            const status = document.getElementById('login-status');
            const btn = document.getElementById('login-btn');

            if(pwdInput.value === HOST_PASSWORD) {
                // UI Feedback
                status.innerText = "Connecting to database...";
                status.className = "text-sm text-yellow-400 mt-2";
                btn.disabled = true;
                btn.classList.add('opacity-50');

                try {
                    // Test Connection before showing Admin Panel
                    const { count, error } = await _supabase.from('questions').select('*', { count: 'exact', head: true });
                    
                    if(error) throw error;

                    // Success
                    document.getElementById('login-panel').classList.add('hidden');
                    document.getElementById('admin-panel').classList.remove('hidden');
                    generateQR();
                    await refreshData();
                } catch (err) {
                    console.error(err);
                    status.innerText = "Connection Failed: " + err.message;
                    status.className = "text-sm text-red-500 mt-2";
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                }
            } else { 
                alert("Wrong Password"); 
            }
        }

        function generateQR() {
            let url = window.location.href.replace('admin.html', '').replace(/admin\/?$/, '');
            if(!url.endsWith('/')) url += '/';
            document.getElementById("player-link-text").innerText = url;
            new QRCode(document.getElementById("qrcode"), { text: url, width: 100, height: 100 });
        }

        function log(msg) { document.getElementById('status-log').innerText = msg; }

        // --- OPTIMIZED DATA FETCHING ---
        async function refreshData() {
            // Run these in parallel for speed
            await Promise.all([
                updateQuestionCount(),
                fetchQuestionList()
            ]);
        }

        async function updateQuestionCount() {
            try {
                const { count } = await _supabase.from('questions').select('*', { count: 'exact', head: true });
                document.getElementById('q-count').innerText = (count || 0);
            } catch (e) {
                document.getElementById('q-count').innerText = "Err";
            }
        }

        async function fetchQuestionList() {
            const listContainer = document.getElementById('db-questions-list');
            try {
                const { data: questions, error } = await _supabase.from('questions').select('*').order('id', { ascending: true });
                
                if(error) throw error;
                
                listContainer.innerHTML = "";
                
                if(questions && questions.length > 0) {
                    questions.forEach((q, idx) => {
                        const isActive = (idx === currentQIndex - 1); 
                        const activeClass = isActive ? "border-2 border-green-500" : "";
                        listContainer.innerHTML += `
                            <div class="bg-gray-700 p-3 rounded flex justify-between items-center text-sm ${activeClass}">
                                <div class="truncate mr-2">
                                    <span class="font-bold text-yellow-400">Q${idx+1}:</span> ${q.question_text}
                                    <br><span class="text-xs text-gray-400">Ans: ${q.correct_option}</span>
                                </div>
                                <button onclick="deleteQuestion(${q.id})" class="bg-red-900 hover:bg-red-700 text-red-200 px-2 py-1 rounded text-xs">Del</button>
                            </div>
                        `;
                    });
                } else {
                    listContainer.innerHTML = "<p class='text-gray-500 italic'>No questions yet.</p>";
                }
            } catch (e) {
                listContainer.innerHTML = "<p class='text-red-400'>Error loading list. <button onclick='fetchQuestionList()' class='underline'>Retry</button></p>";
            }
        }

        async function deleteQuestion(id) {
            if(!confirm("Delete this question?")) return;
            await _supabase.from('questions').delete().eq('id', id);
            refreshData();
        }

        async function addQuestion() {
            const q = {
                question_text: document.getElementById('q-text').value,
                option_a: document.getElementById('opt-a').value,
                option_b: document.getElementById('opt-b').value,
                option_c: document.getElementById('opt-c').value,
                option_d: document.getElementById('opt-d').value,
                correct_option: document.getElementById('correct-opt').value
            };
            if(!q.question_text) return alert("Enter text");
            
            const { error } = await _supabase.from('questions').insert([q]);
            if(error) alert(error.message);
            else { 
                log("Saved!");
                document.getElementById('q-text').value = "";
                refreshData(); 
            }
        }

        async function resetGame() {
            if(!confirm("RESET EVERYTHING? This deletes all scores.")) return;
            
            // Delete in batches or use simple deletes
            await _supabase.from('players').delete().neq('score', -1); 
            await _supabase.from('game_state').update({ status: 'waiting', current_question_id: null }).eq('id', 1);
            await _supabase.from('questions').update({ fastest_player_id: null }).gt('id', 0);

            currentQIndex = 0;
            document.getElementById('game-over-msg').classList.add('hidden');
            document.getElementById('btn-next').innerText = "➡️ NEXT Question";
            log("Game Reset Complete.");
            refreshData();
        }

        async function setNextQuestion() {
            const btn = document.getElementById('btn-next');
            btn.disabled = true; // Prevent double click
            
            try {
                const { data: questions } = await _supabase.from('questions').select('*').order('id', { ascending: true });
                
                if (!questions || questions.length === 0) {
                    alert("No questions!");
                    btn.disabled = false;
                    return;
                }

                if (currentQIndex >= questions.length) {
                    await finishGame();
                    btn.disabled = false;
                    return;
                }

                const nextQ = questions[currentQIndex];
                
                await _supabase.from('game_state').update({ 
                    status: 'active', 
                    current_question_id: nextQ.id, 
                    question_start_time: new Date().toISOString()
                }).eq('id', 1);

                currentQIndex++;
                
                const btnText = (currentQIndex === questions.length) ? "🏁 FINISH GAME" : "➡️ NEXT Question";
                btn.innerText = btnText;
                
                log(`Q${currentQIndex} is LIVE!`);
                document.getElementById('admin-leaderboard-panel').classList.add('hidden');
                refreshData(); 
            } catch (err) {
                alert("Error starting question. Check console.");
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        }

        // --- UPDATED GAME END & LEADERBOARD LOGIC ---

    async function finishGame() {
        await _supabase.from('game_state').update({ status: 'finished' }).eq('id', 1);
        
        document.getElementById('game-over-msg').classList.remove('hidden');
        document.getElementById('btn-next').innerText = "✅ Game Ended";
        log("Game Over. Final Results Sent.");
        
        // Force open the leaderboard without toggling
        if (!isLeaderboardActive) {
            toggleLeaderboard();
        }
    }

    // New Smart Toggle Function (Replaces showLeaderboard)
    let isLeaderboardActive = false;

    async function toggleLeaderboard() {
        const btn = document.getElementById('btn-leaderboard');
        const lbPanel = document.getElementById('admin-leaderboard-panel');
        
        // CASE 1: HIDE LEADERBOARD (RESUME GAME)
        if (isLeaderboardActive) {
            // If game is ended, don't change status to active, keep it finished
            if (document.getElementById('btn-next').innerText !== "✅ Game Ended") {
                const nextStatus = (currentQIndex > 0) ? 'active' : 'waiting';
                await _supabase.from('game_state').update({ status: nextStatus }).eq('id', 1);
                log("Game Resumed!");
            }
            
            lbPanel.classList.add('hidden');
            btn.innerText = "🏆 Show Leaderboard";
            btn.classList.replace('bg-gray-600', 'bg-purple-600');
            isLeaderboardActive = false;
        } 
        
        // CASE 2: SHOW LEADERBOARD (PAUSE GAME)
        else {
            // Only update status if game isn't already finished
            if (document.getElementById('btn-next').innerText !== "✅ Game Ended") {
                await _supabase.from('game_state').update({ status: 'leaderboard' }).eq('id', 1);
            }
            
            lbPanel.classList.remove('hidden');
            
            // FETCH & RENDER (Top 200)
            const { data: players } = await _supabase.from('players').select('*')
                .order('score', { ascending: false })
                .order('last_answer_time', { ascending: true, nullsFirst: false }) 
                .limit(200);
            
            const list = document.getElementById('admin-lb-list');
            list.className = "space-y-2 max-h-96 overflow-y-auto pr-2 custom-scrollbar";
            list.innerHTML = "";
            
            players.forEach((p, i) => {
                const medal = ["🥇","🥈","🥉"][i] || `#${i+1}`;
                const bgClass = i % 2 === 0 ? "bg-purple-800" : "bg-purple-900";
                list.innerHTML += `
                    <div class="flex justify-between items-center ${bgClass} p-2 rounded border-b border-purple-600">
                        <span class="text-lg">${medal} ${p.name}</span> 
                        <span class="font-bold text-yellow-300">${p.score}</span>
                    </div>`;
            });

            btn.innerText = "❌ Hide & Resume";
            btn.classList.replace('bg-purple-600', 'bg-gray-600');
            isLeaderboardActive = true;
            log("Leaderboard is LIVE.");
        }
    }

        function playMusic() { document.getElementById('sound-suspense').play(); }

        // --- FULLSCREEN QR LOGIC ---

        function showFullscreenQR() {
        const modal = document.getElementById('qr-modal');
        const largeContainer = document.getElementById('qrcode-large');
        
        // Get the URL we are already using
        const url = document.getElementById("player-link-text").innerText;
        
        // Clear any old QR and make a BIG one (400x400)
        largeContainer.innerHTML = "";
        new QRCode(largeContainer, { text: url, width: 450, height: 450 });
        
        // Show Modal
        modal.classList.remove('hidden');
        }

        function closeFullscreenQR() {
        document.getElementById('qr-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
